name: Validate Diego GG
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check api/player.js
          node --check api/history.js
          node --check api/status.js
          node --check api/_lib/riot.js
          node --check api/_lib/scoring.js
      - name: Unit tests
        run: npm test
      - name: Prevent accidental Riot token commits
        run: |
          if git grep -n -E 'RGAPI-[a-f0-9]{8}-[a-f0-9]{4}-' -- .; then
            echo 'A Riot API key appears to be committed.'; exit 1
          fi
